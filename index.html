<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ViralFeed — Trending Video & GIF Feed</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="Discover the hottest trending videos and viral GIFs. Scroll, watch, and share — endless entertainment at your fingertips.">
    <meta name="keywords" content="trending videos, viral GIFs, video feed, funny videos, gaming clips, animal videos">
    <meta name="author" content="ViralFeed">
    <meta name="theme-color" content="#000000">

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="ViralFeed — Trending Video & GIF Feed">
    <meta property="og:description" content="Discover the hottest trending videos and viral GIFs. Scroll, watch, and share.">
    <meta property="og:url" content="/">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="ViralFeed — Trending Video & GIF Feed">
    <meta name="twitter:description" content="Discover the hottest trending videos and viral GIFs.">

    <!-- Google Fonts — Inter (modern, clean) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Stylesheet (eksternal) -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==========================================
         TOP NAVIGATION — Kategori Video
    ========================================== -->
    <div class="top-nav">
        <div class="nav-tab" data-tag="funny">Funny</div>
        <div class="nav-tab active" data-tag="trending">Trending</div>
        <div class="nav-tab" data-tag="gaming">Gaming</div>
        <div class="nav-tab" data-tag="animals">Animals</div>
    </div>

    <!-- ==========================================
         VIDEO CONTAINER — Tempat video di-render
    ========================================== -->
    <div class="video-container" id="videoContainer"></div>

    <!-- ==========================================
         LOADING MORE INDICATOR
    ========================================== -->
    <div class="loading-more" id="loadingMore">
        <div class="loading-spinner" style="width:30px;height:30px;border-width:3px"></div>
    </div>

    <!-- ==========================================
         ERROR MESSAGE
    ========================================== -->
    <div class="error-message" id="errorMessage">
        <p id="errorText">Failed to load videos</p>
        <button class="refresh-btn" id="retryBtn">Retry</button>
    </div>

    <!-- ==========================================
         SCRIPTS
         Urutan: App Logic → Ads (non-blocking)
    ========================================== -->
    <script src="script.js"></script>
    <script src="ads.js" defer></script>

</body>

</html>
