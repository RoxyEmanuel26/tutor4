<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Feed - Scroll to Watch</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#000;color:#fff;overflow:hidden;height:100vh;width:100vw}
        .video-container{height:100vh;width:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scroll-behavior:smooth}
        .video-container::-webkit-scrollbar{display:none}
        .video-item{height:100vh;width:100%;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center;background:#1a1a1a}
        .video-item video{width:100%;height:100%;object-fit:contain;background:#000}
        .video-info{position:absolute;bottom:80px;left:15px;right:80px;z-index:10}
        .video-title{font-size:16px;font-weight:600;margin-bottom:8px;text-shadow:1px 1px 3px rgba(0,0,0,0.8);max-height:60px;overflow:hidden}
        .video-author{font-size:14px;color:#fff;opacity:0.9}
        .video-author::before{content:'@';font-weight:bold}
        .sidebar{position:absolute;right:10px;bottom:100px;display:flex;flex-direction:column;align-items:center;gap:20px;z-index:10}
        .sidebar-btn{display:flex;flex-direction:column;align-items:center;background:transparent;border:none;color:#fff;cursor:pointer}
        .sidebar-btn .icon{width:45px;height:45px;background:rgba(255,255,255,0.15);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px}
        .sidebar-btn .count{font-size:12px;margin-top:5px;font-weight:600;text-shadow:1px 1px 2px rgba(0,0,0,0.5)}
        .play-pause-overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:80px;opacity:0;transition:opacity 0.3s;pointer-events:none}
        .play-pause-overlay.show{opacity:1}
        .loading-spinner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:50px;height:50px;border:4px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}
        @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
        .top-nav{position:fixed;top:0;left:0;right:0;padding:15px 20px;background:linear-gradient(rgba(0,0,0,0.7),transparent);z-index:100;display:flex;justify-content:center;gap:30px}
        .nav-tab{color:rgba(255,255,255,0.6);font-size:16px;font-weight:600;cursor:pointer;padding:8px 16px;border-radius:20px;transition:all 0.3s}
        .nav-tab.active{color:#fff;background:rgba(255,255,255,0.2)}
        .error-message{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(220,38,38,0.9);padding:20px 30px;border-radius:10px;text-align:center;z-index:1000;display:none}
        .error-message.show{display:block}
        .refresh-btn{margin-top:15px;padding:10px 25px;background:#fff;color:#dc2626;border:none;border-radius:25px;font-weight:600;cursor:pointer}
    </style>
</head>
<body>
    <div class="top-nav">
        <div class="nav-tab" data-tag="funny">Funny</div>
        <div class="nav-tab active" data-tag="trending">Trending</div>
        <div class="nav-tab" data-tag="gaming">Gaming</div>
        <div class="nav-tab" data-tag="animals">Animals</div>
    </div>
    <div class="video-container" id="videoContainer"></div>
    <div class="error-message" id="errorMessage">
        <p id="errorText">Failed to load videos</p>
        <button class="refresh-btn" onclick="loadVideos()">Retry</button>
    </div>
    <script>
        const API_BASE='https://api.redgifs.com/v2';
        let authToken=null,currentVideos=[],currentIndex=0,currentTag='trending',isLoading=false;
        
        async function getAuthToken(){
            try{
                const response=await fetch(`${API_BASE}/auth/temporary`,{method:'GET',headers:{'Accept':'application/json'}});
                if(!response.ok)throw new Error('Failed to get auth token');
                const data=await response.json();
                authToken=data.token;
                return authToken;
            }catch(error){
                console.error('Auth error:',error);
                showError('Authentication failed. Please refresh.');
                return null;
            }
        }

        async function fetchVideos(tag='trending',page=1){
            try{
                if(!authToken)await getAuthToken();
                const url=tag==='trending'?`${API_BASE}/gifs/trending?count=10&page=${page}`:`${API_BASE}/gifs/search?tags=${tag}&count=10&page=${page}`;
                const response=await fetch(url,{method:'GET',headers:{'Authorization':`Bearer ${authToken}`,'Accept':'application/json'}});
                if(!response.ok){
                    if(response.status===401){authToken=null;await getAuthToken();return fetchVideos(tag,page);}
                    throw new Error(`HTTP ${response.status}`);
                }
                const data=await response.json();
                return data.gifs||[];
            }catch(error){
                console.error('Fetch error:',error);
                showError('Failed to load videos. Please try again.');
                return[];
            }
        }

        function createVideoElement(videoData,index){
            const item=document.createElement('div');
            item.className='video-item';
            item.dataset.index=index;
            const urls=videoData.urls;
            const videoUrl=urls.hd||urls.sd||urls.gif;
            item.innerHTML=`<video src="${videoUrl}" loop playsinline preload="metadata" poster="${videoData.poster||''}"></video><div class="loading-spinner"></div><div class="play-pause-overlay">▶</div><div class="video-info"><div class="video-title">${videoData.title||'Untitled'}</div><div class="video-author">${videoData.author||'unknown'}</div></div><div class="sidebar"><button class="sidebar-btn" onclick="toggleLike(this)"><div class="icon">♥</div><span class="count">${formatNumber(videoData.likes||0)}</span></button><button class="sidebar-btn"><div class="icon">💬</div><span class="count">${formatNumber(videoData.comments||0)}</span></button><button class="sidebar-btn" onclick="shareVideo('${videoData.id}')"><div class="icon">↗</div><span class="count">Share</span></button></div>`;
            const video=item.querySelector('video'),spinner=item.querySelector('.loading-spinner'),playOverlay=item.querySelector('.play-pause-overlay');
            video.addEventListener('loadeddata',()=>{spinner.style.display='none';});
            video.addEventListener('waiting',()=>{spinner.style.display='block';});
            video.addEventListener('playing',()=>{spinner.style.display='none';playOverlay.classList.remove('show');});
            video.addEventListener('click',()=>togglePlay(video,playOverlay));
            const observer=new IntersectionObserver((entries)=>{entries.forEach(entry=>{if(entry.isIntersecting&&entry.intersectionRatio>0.7){video.play().catch(e=>console.log('Autoplay prevented'));currentIndex=index;}else{video.pause();video.currentTime=0;}});},{threshold:[0.7]});
            observer.observe(item);
            return item;
        }

        function togglePlay(video,overlay){
            if(video.paused){video.play();overlay.textContent='▶';overlay.classList.add('show');setTimeout(()=>overlay.classList.remove('show'),500);}
            else{video.pause();overlay.textContent='⏸';overlay.classList.add('show');setTimeout(()=>overlay.classList.remove('show'),500);}
        }

        function formatNumber(num){if(num>=1000000)return(num/1000000).toFixed(1)+'M';else if(num>=1000)return(num/1000).toFixed(1)+'K';return num.toString();}
        function toggleLike(btn){const icon=btn.querySelector('.icon');icon.style.color=icon.style.color==='red'?'#fff':'red';}
        function shareVideo(id){const url=`https://redgifs.com/watch/${id}`;if(navigator.share){navigator.share({title:'Check out this video',url:url}).catch(console.error);}else{navigator.clipboard.writeText(url);alert('Link copied!');}}
        function showError(message){document.getElementById('errorText').textContent=message;document.getElementById('errorMessage').classList.add('show');}
        function hideError(){document.getElementById('errorMessage').classList.remove('show');}

        async function loadVideos(){
            if(isLoading)return;
            isLoading=true;hideError();
            const container=document.getElementById('videoContainer');
            container.innerHTML='';currentVideos=[];
            const videos=await fetchVideos(currentTag);
            if(videos.length===0){showError('No videos available. Try another category.');isLoading=false;return;}
            currentVideos=videos;
            videos.forEach((video,index)=>{container.appendChild(createVideoElement(video,index));});
            isLoading=false;
        }

        document.querySelectorAll('.nav-tab').forEach(tab=>{
            tab.addEventListener('click',()=>{
                document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
                tab.classList.add('active');currentTag=tab.dataset.tag;loadVideos();
            });
        });

        const container=document.getElementById('videoContainer');
        container.addEventListener('scroll',async()=>{
            const scrollTop=container.scrollTop,scrollHeight=container.scrollHeight,clientHeight=container.clientHeight;
            if(scrollTop+clientHeight>=scrollHeight-500&&!isLoading){
                isLoading=true;
                const moreVideos=await fetchVideos(currentTag,Math.floor(currentVideos.length/10)+2);
                moreVideos.forEach((video,index)=>{currentVideos.push(video);container.appendChild(createVideoElement(video,currentVideos.length));});
                isLoading=false;
            }
        });

        document.addEventListener('DOMContentLoaded',async()=>{await getAuthToken();loadVideos();});
        document.addEventListener('visibilitychange',()=>{if(document.hidden){document.querySelectorAll('video').forEach(v=>v.pause());}});
    </script>
</body>
</html>
