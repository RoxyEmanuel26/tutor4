<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Feed - Scroll to Watch</title>

    <!-- Stylesheet (eksternal) -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==========================================
         TOP NAVIGATION — Kategori Video
    ========================================== -->
    <div class="top-nav">
        <div class="nav-tab" data-tag="funny">Funny</div>
        <div class="nav-tab active" data-tag="trending">Trending</div>
        <div class="nav-tab" data-tag="gaming">Gaming</div>
        <div class="nav-tab" data-tag="animals">Animals</div>
    </div>

    <!-- ==========================================
         VIDEO CONTAINER — Tempat video di-render
    ========================================== -->
    <div class="video-container" id="videoContainer"></div>

    <!-- ==========================================
         LOADING MORE INDICATOR
    ========================================== -->
    <div class="loading-more" id="loadingMore">
        <div class="loading-spinner" style="width:30px;height:30px;border-width:3px"></div>
    </div>

    <!-- ==========================================
         ERROR MESSAGE
    ========================================== -->
    <div class="error-message" id="errorMessage">
        <p id="errorText">Failed to load videos</p>
        <button class="refresh-btn" id="retryBtn">Retry</button>
    </div>

    <!-- ==========================================
         SCRIPTS
         Urutan: App Logic → Ads (non-blocking)
    ========================================== -->
    <script src="script.js"></script>
    <script src="ads.js" defer></script>

</body>

</html>
