<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Feed - Scroll to Watch</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#000;color:#fff;overflow:hidden;height:100vh;width:100vw}
        .video-container{height:100vh;width:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scroll-behavior:smooth}
        .video-container::-webkit-scrollbar{display:none}
        .video-item{height:100vh;width:100%;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center;background:#1a1a1a}
        .video-wrapper{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
        .video-item video{width:100%;height:100%;object-fit:contain;background:#000}
        .video-info{position:absolute;bottom:100px;left:15px;right:80px;z-index:10;max-height:40vh;overflow:hidden}
        .video-title{font-size:16px;font-weight:600;margin-bottom:8px;text-shadow:1px 1px 3px rgba(0,0,0,0.8);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
        .video-author{font-size:14px;color:#fff;opacity:0.9;margin-bottom:5px}
        .video-author::before{content:'@';font-weight:bold}
        .video-tags{font-size:12px;color:rgba(255,255,255,0.8);margin-top:5px}
        .sidebar{position:absolute;right:10px;bottom:120px;display:flex;flex-direction:column;align-items:center;gap:20px;z-index:10}
        .sidebar-btn{display:flex;flex-direction:column;align-items:center;background:transparent;border:none;color:#fff;cursor:pointer;transition:transform 0.2s}
        .sidebar-btn:active{transform:scale(0.9)}
        .sidebar-btn .icon{width:45px;height:45px;background:rgba(255,255,255,0.15);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;transition:all 0.3s}
        .sidebar-btn .count{font-size:12px;margin-top:5px;font-weight:600;text-shadow:1px 1px 2px rgba(0,0,0,0.5)}
        .play-pause-overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:80px;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:20;text-shadow:0 0 20px rgba(0,0,0,0.5)}
        .play-pause-overlay.show{opacity:1}
        .loading-spinner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:50px;height:50px;border:4px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;z-index:15}
        @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
        .top-nav{position:fixed;top:0;left:0;right:0;padding:15px 20px;background:linear-gradient(rgba(0,0,0,0.8),transparent);z-index:100;display:flex;justify-content:center;gap:15px}
        .nav-tab{color:rgba(255,255,255,0.6);font-size:14px;font-weight:600;cursor:pointer;padding:8px 16px;border-radius:20px;transition:all 0.3s;white-space:nowrap}
        .nav-tab.active{color:#fff;background:rgba(255,255,255,0.2)}
        .nav-tab:hover{background:rgba(255,255,255,0.1)}
        .error-message{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(220,38,38,0.9);padding:20px 30px;border-radius:10px;text-align:center;z-index:1000;display:none;max-width:90%}
        .error-message.show{display:block}
        .refresh-btn{margin-top:15px;padding:10px 25px;background:#fff;color:#dc2626;border:none;border-radius:25px;font-weight:600;cursor:pointer}
        .progress-bar{position:absolute;bottom:0;left:0;height:3px;background:rgba(255,255,255,0.3);z-index:15;width:100%}
        .progress-fill{height:100%;background:#fff;width:0%;transition:width 0.1s linear}
        .fullscreen-btn{position:absolute;top:15px;right:15px;z-index:20;background:rgba(0,0,0,0.5);border:none;color:#fff;width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer;opacity:0;transition:opacity 0.3s}
        .video-wrapper:hover .fullscreen-btn{opacity:1}
        .swipe-hint{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.6);padding:8px 16px;border-radius:20px;font-size:12px;z-index:90;opacity:0.8;pointer-events:none}
        .loading-more{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:90;display:none}
        .loading-more.show{display:block}
        .like-active .icon{background:rgba(255,0,0,0.3);color:red}
    </style>
</head>
<body>
    <div class="top-nav">
        <div class="nav-tab" data-tag="funny">Funny</div>
        <div class="nav-tab active" data-tag="trending">Trending</div>
        <div class="nav-tab" data-tag="gaming">Gaming</div>
        <div class="nav-tab" data-tag="animals">Animals</div>
    </div>
    <div class="video-container" id="videoContainer"></div>
    <div class="loading-more" id="loadingMore"><div class="loading-spinner" style="width:30px;height:30px;border-width:3px"></div></div>
    <div class="error-message" id="errorMessage">
        <p id="errorText">Failed to load videos</p>
        <button class="refresh-btn" id="retryBtn">Retry</button>
    </div>
    <script>
        const API_BASE='https://api.redgifs.com/v2';
        let authToken=null,authExpiry=null,currentVideos=[],currentIndex=0,currentTag='trending',isLoading=false,currentPage=1,hasMore=true;
        let touchStartY=0,touchEndY=0,lastTapTime=0,scrollTimeout=null;
        const VIDEO_CACHE=new Map();
        const MAX_CACHED_VIDEOS=20;
        
        // Logging untuk debugging
        function log(...args){console.log('[VideoFeed]',...args);}
        function logError(...args){console.error('[VideoFeed ERROR]',...args);}
        
        // CORS Proxy fallback jika direct access gagal
        const CORS_PROXIES=[
            '',  // Try direct first
            'https://corsproxy.io/?',
            'https://api.allorigins.win/raw?url='
        ];
        let currentProxyIndex=0;
        
        // Singleton Intersection Observer untuk semua video
        let videoObserver=null;
        function getVideoObserver(){
            if(!videoObserver){
                videoObserver=new IntersectionObserver((entries)=>{
                    entries.forEach(entry=>{
                        const item=entry.target;
                        const video=item.querySelector('video');
                        const spinner=item.querySelector('.loading-spinner');
                        const playOverlay=item.querySelector('.play-pause-overlay');
                        const progressBar=item.querySelector('.progress-fill');
                        
                        if(!video||!spinner||!playOverlay||!progressBar)return;
                        
                        if(entry.isIntersecting&&entry.intersectionRatio>0.7){
                            video.muted=true;
                            video.play().catch(e=>{
                                if(e.name!=='AbortError')console.log('Autoplay prevented');
                            });
                            // Update currentIndex
                            const index=parseInt(item.dataset.index);
                            if(!isNaN(index))currentIndex=index;
                        }else{
                            video.pause();
                            video.currentTime=0;
                            progressBar.style.width='0%';
                        }
                    });
                },{threshold:[0.7],rootMargin:'50px'});
            }
            return videoObserver;
        }

        // Throttle function untuk scroll event
        function throttle(func,limit){
            let inThrottle;
            return function(...args){
                if(!inThrottle){
                    func.apply(this,args);
                    inThrottle=true;
                    setTimeout(()=>inThrottle=false,limit);
                }
            };
        }

        async function getAuthToken(forceRefresh=false){
            const now=Date.now();
            // Cek jika token masih valid (expired dalam 5 menit)
            if(authToken&&!forceRefresh&&authExpiry&&(now<authExpiry-300000)){
                log('Using cached auth token');
                return authToken;
            }
            try{
                log('Fetching new auth token...');
                // Try with CORS proxies if direct fails
                let response=null;
                for(let i=currentProxyIndex;i<CORS_PROXIES.length;i++){
                    const proxy=CORS_PROXIES[i];
                    const url=proxy?`${proxy}${encodeURIComponent(`${API_BASE}/auth/temporary`)}`:`${API_BASE}/auth/temporary`;
                    log(`Trying auth with proxy: ${proxy||'direct'}`);
                    try{
                        response=await fetch(url,{method:'GET',headers:{'Accept':'application/json'}});
                        if(response.ok)break;
                    }catch(e){
                        logError(`Proxy ${proxy} failed:`,e);
                        continue;
                    }
                }
                if(!response||!response.ok){
                    logError('Auth response not OK:',response?response.status:'no response');
                    throw new Error('Failed to get auth token');
                }
                const data=await response.json();
                if(!data.token){
                    logError('No token in response');
                    throw new Error('No token received');
                }
                authToken=data.token;
                // Set expiry time (asumsi token valid 1 jam)
                authExpiry=now+3600000;
                log('Auth token received, expires in 1 hour');
                return authToken;
            }catch(error){
                logError('Auth error:',error);
                showError('Authentication failed. Please refresh.');
                return null;
            }
        }

        async function fetchVideos(tag='trending',page=1){
            try{
                log(`Fetching videos for tag: ${tag}, page: ${page}`);
                const token=await getAuthToken();
                if(!token){
                    logError('No auth token available');
                    return[];
                }
                const baseUrl=tag==='trending'?`${API_BASE}/gifs/trending?count=10&page=${page}`:`${API_BASE}/gifs/search?tags=${tag}&count=10&page=${page}`;
                // Try with CORS proxies
                let response=null;
                for(let i=currentProxyIndex;i<CORS_PROXIES.length;i++){
                    const proxy=CORS_PROXIES[i];
                    const url=proxy?`${proxy}${encodeURIComponent(baseUrl)}`:baseUrl;
                    log(`Trying videos with proxy: ${proxy||'direct'}`);
                    try{
                        response=await fetch(url,{method:'GET',headers:{'Authorization':`Bearer ${token}`,'Accept':'application/json'}});
                        if(response.ok)break;
                    }catch(e){
                        logError(`Proxy ${proxy} failed:`,e);
                        continue;
                    }
                }
                if(!response||!response.ok){
                    logError('Video response not OK:',response?response.status:'no response');
                    if(response&&response.status===401){
                        logError('401 Unauthorized, refreshing token...');
                        authToken=null;
                        await getAuthToken(true);
                        return fetchVideos(tag,page);
                    }
                    throw new Error(`HTTP ${response?response.status:'unknown'}`);
                }
                const data=await response.json();
                log('Received gifs:',data.gifs?data.gifs.length:0);
                hasMore=data.gifs&&data.gifs.length===10;
                return data.gifs||[];
            }catch(error){
                logError('Fetch error:',error);
                if(error.message.includes('401')){
                    authToken=null;
                    await getAuthToken(true);
                    return fetchVideos(tag,page);
                }
                showError('Failed to load videos. Please try again.');
                return[];
            }
        }

        function createVideoElement(videoData,globalIndex){
            const item=document.createElement('div');
            item.className='video-item';
            item.dataset.index=globalIndex;
            item.id=`video-${globalIndex}`;
            const urls=videoData.urls;
            const videoUrl=urls.hd||urls.sd||urls.gif;
            const title=videoData.title||'Untitled Video';
            const author=videoData.author||videoData.userName||'unknown';
            const likes=videoData.likes||Math.floor(Math.random()*50000);
            const comments=videoData.comments||Math.floor(Math.random()*1000);
            
            // Gunakan DocumentFragment untuk performa lebih baik
            const fragment=document.createDocumentFragment();
            const wrapper=document.createElement('div');
            wrapper.className='video-wrapper';
            
            const video=document.createElement('video');
            video.src=videoUrl;
            video.loop=true;
            video.playsInline=true;
            video.preload='metadata';
            video.poster=videoData.poster||'';
            video.muted=true;
            
            const spinner=document.createElement('div');
            spinner.className='loading-spinner';
            
            const playOverlay=document.createElement('div');
            playOverlay.className='play-pause-overlay';
            playOverlay.textContent='▶';
            
            const fullscreenBtn=document.createElement('button');
            fullscreenBtn.className='fullscreen-btn';
            fullscreenBtn.textContent='⛶';
            fullscreenBtn.type='button';
            fullscreenBtn.setAttribute('aria-label','Toggle fullscreen');
            
            const progressBarContainer=document.createElement('div');
            progressBarContainer.className='progress-bar';
            const progressBar=document.createElement('div');
            progressBar.className='progress-fill';
            progressBarContainer.appendChild(progressBar);
            
            wrapper.appendChild(video);
            wrapper.appendChild(spinner);
            wrapper.appendChild(playOverlay);
            wrapper.appendChild(fullscreenBtn);
            wrapper.appendChild(progressBarContainer);
            fragment.appendChild(wrapper);
            
            const infoDiv=document.createElement('div');
            infoDiv.className='video-info';
            infoDiv.innerHTML=`
                <div class="video-title">${escapeHtml(title)}</div>
                <div class="video-author">${escapeHtml(author)}</div>
                <div class="video-tags">#${videoData.tags?escapeHtml(videoData.tags[0]||'video'):'viral'}</div>
            `;
            fragment.appendChild(infoDiv);
            
            const sidebar=document.createElement('div');
            sidebar.className='sidebar';
            sidebar.innerHTML=`
                <button class="sidebar-btn like-btn" type="button" aria-label="Like"><div class="icon">♥</div><span class="count">${formatNumber(likes)}</span></button>
                <button class="sidebar-btn" type="button" aria-label="Comment"><div class="icon">💬</div><span class="count">${formatNumber(comments)}</span></button>
                <button class="sidebar-btn share-btn" type="button" aria-label="Share"><div class="icon">↗</div><span class="count">Share</span></button>
            `;
            fragment.appendChild(sidebar);
            
            item.appendChild(fragment);
            
            // Video event listeners dengan error handling
            video.addEventListener('loadeddata',()=>{spinner.style.display='none';},{once:true});
            video.addEventListener('waiting',()=>{spinner.style.display='block';});
            video.addEventListener('playing',()=>{spinner.style.display='none';playOverlay.classList.remove('show');});
            video.addEventListener('timeupdate',()=>{
                if(video.duration&&isFinite(video.duration)){
                    const percent=(video.currentTime/video.duration)*100;
                    progressBar.style.width=percent+'%';
                }
            });
            video.addEventListener('ended',()=>{progressBar.style.width='0%';});
            video.addEventListener('error',(e)=>{
                console.error('Video load error:',e);
                spinner.style.display='none';
                video.style.display='none';
                const errorIcon=document.createElement('div');
                errorIcon.style.cssText='position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:48px;opacity:0.7;';
                errorIcon.textContent='⚠️';
                wrapper.appendChild(errorIcon);
            });
            
            // Click to play/pause - gunakan event delegation
            wrapper.addEventListener('click',(e)=>{
                const target=e.target;
                if(target.classList.contains('sidebar-btn')||target.classList.contains('fullscreen-btn')||target.closest('.sidebar-btn'))return;
                togglePlay(video,playOverlay);
            });
            
            // Double tap detection untuk fullscreen
            let lastTap=0;
            wrapper.addEventListener('touchend',(e)=>{
                const currentTime=new Date().getTime();
                const tapLength=currentTime-lastTap;
                if(tapLength<300&&tapLength>0){
                    toggleFullscreen(fullscreenBtn);
                    e.preventDefault();
                }
                lastTap=currentTime;
            },{passive:false});
            
            // Gunakan singleton observer
            getVideoObserver().observe(item);
            
            // Like button handler
            const likeBtn=item.querySelector('.like-btn');
            if(likeBtn){
                likeBtn.addEventListener('click',function(){
                    this.classList.toggle('like-active');
                    const countSpan=this.querySelector('.count');
                    let count=parseCount(countSpan.textContent);
                    if(this.classList.contains('like-active')){
                        count++;
                    }else{
                        count--;
                    }
                    countSpan.textContent=formatNumber(count);
                });
            }
            
            // Share button handler
            const shareBtn=item.querySelector('.share-btn');
            if(shareBtn){
                shareBtn.addEventListener('click',()=>{
                    shareVideo(videoData.id);
                });
            }
            
            return item;
        }

        function escapeHtml(text){
            const div=document.createElement('div');
            div.textContent=text;
            return div.innerHTML;
        }

        function togglePlay(video,overlay){
            if(video.paused){
                video.play();
                overlay.textContent='▶';
                overlay.classList.add('show');
                setTimeout(()=>overlay.classList.remove('show'),500);
            }else{
                video.pause();
                overlay.textContent='⏸';
                overlay.classList.add('show');
                setTimeout(()=>overlay.classList.remove('show'),500);
            }
        }

        function toggleFullscreen(btn){
            const videoItem=btn.closest('.video-item');
            const video=videoItem.querySelector('video');
            if(!document.fullscreenElement){
                videoItem.requestFullscreen().catch(err=>console.log('Fullscreen error:',err));
                btn.textContent='❐';
            }else{
                document.exitFullscreen();
                btn.textContent='⛶';
            }
        }

        function formatNumber(num){
            if(num>=1000000)return(num/1000000).toFixed(1)+'M';
            else if(num>=1000)return(num/1000).toFixed(1)+'K';
            return num.toString();
        }

        function toggleLike(btn){
            btn.classList.toggle('like-active');
            const countSpan=btn.querySelector('.count');
            let count=parseCount(countSpan.textContent);
            if(btn.classList.contains('like-active')){
                count++;
            }else{
                count--;
            }
            countSpan.textContent=formatNumber(count);
        }

        function parseCount(str){
            if(str.includes('M'))return parseFloat(str)*1000000;
            if(str.includes('K'))return parseFloat(str)*1000;
            return parseInt(str)||0;
        }

        function shareVideo(id){
            const url=`https://redgifs.com/watch/${id}`;
            if(navigator.share){
                navigator.share({title:'Check out this video',url:url}).catch(console.error);
            }else{
                navigator.clipboard.writeText(url);
                showToast('Link copied to clipboard!');
            }
        }

        function showToast(message){
            const toast=document.createElement('div');
            toast.style.cssText='position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);padding:12px 24px;border-radius:25px;z-index:1000;font-size:14px;';
            toast.textContent=message;
            document.body.appendChild(toast);
            setTimeout(()=>toast.remove(),2000);
        }

        function showError(message){
            document.getElementById('errorText').textContent=message;
            document.getElementById('errorMessage').classList.add('show');
        }

        function hideError(){
            document.getElementById('errorMessage').classList.remove('show');
        }

        async function loadVideos(reset=true){
            if(isLoading)return;
            isLoading=true;
            hideError();
            const container=document.getElementById('videoContainer');
            
            if(reset){
                // Cleanup observer untuk semua video yang ada
                if(videoObserver){
                    document.querySelectorAll('.video-item').forEach(item=>{
                        videoObserver.unobserve(item);
                    });
                }
                container.innerHTML='';
                currentVideos=[];
                currentPage=1;
                currentIndex=0;
            }
            
            log('Loading videos, reset:',reset,'page:',currentPage);
            const videos=await fetchVideos(currentTag,currentPage);
            log('Videos loaded:',videos.length);
            if(videos.length===0){
                if(reset){
                    logError('No videos available for tag:',currentTag);
                    showError('No videos available. Try another category.');
                }
                isLoading=false;
                return;
            }
            
            currentVideos=[...currentVideos,...videos];
            const fragment=document.createDocumentFragment();
            videos.forEach((video,index)=>{
                const globalIndex=currentVideos.length-videos.length+index;
                fragment.appendChild(createVideoElement(video,globalIndex));
            });
            container.appendChild(fragment);
            
            currentPage++;
            isLoading=false;
        }

        // Navigation tabs
        document.querySelectorAll('.nav-tab').forEach(tab=>{
            tab.addEventListener('click',()=>{
                document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
                tab.classList.add('active');
                currentTag=tab.dataset.tag;
                loadVideos(true);
            });
        });

        // Retry button handler
        document.getElementById('retryBtn')?.addEventListener('click',()=>{
            loadVideos(true);
        });

        // Infinite scroll dengan throttle
        const container=document.getElementById('videoContainer');
        const handleScroll=async()=>{
            const scrollTop=container.scrollTop;
            const scrollHeight=container.scrollHeight;
            const clientHeight=container.clientHeight;
            
            if(scrollTop+clientHeight>=scrollHeight-300&&!isLoading&&hasMore){
                isLoading=true;
                document.getElementById('loadingMore').classList.add('show');
                
                const moreVideos=await fetchVideos(currentTag,currentPage);
                if(moreVideos.length>0){
                    const fragment=document.createDocumentFragment();
                    moreVideos.forEach((video,index)=>{
                        const globalIndex=currentVideos.length+index;
                        fragment.appendChild(createVideoElement(video,globalIndex));
                    });
                    container.appendChild(fragment);
                    currentVideos=[...currentVideos,...moreVideos];
                    currentPage++;
                }
                
                isLoading=false;
                document.getElementById('loadingMore').classList.remove('show');
            }
        };
        container.addEventListener('scroll',throttle(handleScroll,200),{passive:true});

        // Touch gestures for swipe
        container.addEventListener('touchstart',(e)=>{
            touchStartY=e.touches[0].clientY;
        },{passive:true});

        container.addEventListener('touchmove',(e)=>{
            touchEndY=e.touches[0].clientY;
        },{passive:true});

        // Keyboard navigation
        document.addEventListener('keydown',(e)=>{
            const videos=document.querySelectorAll('.video-item');
            if(e.key==='ArrowDown'||e.key==='j'){
                e.preventDefault();
                if(currentIndex<videos.length-1){
                    videos[currentIndex+1].scrollIntoView({behavior:'smooth'});
                }
            }else if(e.key==='ArrowUp'||e.key==='k'){
                e.preventDefault();
                if(currentIndex>0){
                    videos[currentIndex-1].scrollIntoView({behavior:'smooth'});
                }
            }else if(e.key===' '||e.key==='Enter'){
                e.preventDefault();
                const currentVideo=videos[currentIndex]?.querySelector('video');
                const overlay=videos[currentIndex]?.querySelector('.play-pause-overlay');
                if(currentVideo)togglePlay(currentVideo,overlay);
            }else if(e.key==='f'){
                const btn=videos[currentIndex]?.querySelector('.fullscreen-btn');
                if(btn)toggleFullscreen(btn);
            }
        });

        // Initialize dengan cleanup yang benar
        document.addEventListener('DOMContentLoaded',async()=>{
            log('DOM Content Loaded, initializing...');
            const token=await getAuthToken();
            if(token){
                log('Auth successful, loading videos...');
                loadVideos(true);
            }else{
                logError('Auth failed on init');
                showError('Failed to authenticate. Please refresh.');
            }
        });

        // Pause when tab is hidden - pause semua video
        document.addEventListener('visibilitychange',()=>{
            if(document.hidden){
                document.querySelectorAll('video').forEach(v=>{
                    v.pause();
                });
            }
        });

        // Handle fullscreen change dengan selector yang benar
        document.addEventListener('fullscreenchange',()=>{
            const currentVideoItem=document.querySelector(`#video-${currentIndex}`);
            if(currentVideoItem){
                const btn=currentVideoItem.querySelector('.fullscreen-btn');
                if(btn){
                    btn.textContent=document.fullscreenElement?'❐':'⛶';
                }
            }
        });

        // Cleanup saat page unload untuk mencegah memory leak
        window.addEventListener('beforeunload',()=>{
            if(videoObserver){
                videoObserver.disconnect();
                videoObserver=null;
            }
            document.querySelectorAll('video').forEach(v=>{
                v.pause();
                v.src='';
                v.load();
            });
        });
    </script>
</body>
</html>
